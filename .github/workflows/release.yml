name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: simple-connect-linux-amd64
          - goos: darwin
            goarch: amd64
            name: simple-connect-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: simple-connect-darwin-arm64
          - goos: windows
            goarch: amd64
            name: simple-connect-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o dist/${{ matrix.name }} .
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 整理产物到 dist 根目录
        run: |
          cd dist
          for d in */; do
            mv "$d"/* .
            rmdir "$d"
          done
          ls -lh
      - name: 生成 SHA256SUMS 校验文件
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true